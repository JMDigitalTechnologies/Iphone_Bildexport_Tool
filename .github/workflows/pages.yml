# Baut die Projektseite (site/) plus Live-Demo (ui.html im Demo-Modus)
# und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenbauen
        run: |
          mkdir -p _site/demo
          cp -r site/. _site/
          cp ui.html _site/demo/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
